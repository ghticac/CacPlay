<div class="max-w-[1400px] mx-auto px-8 py-12 bg-black min-h-screen flex flex-col justify-between">
  
  <div>
    <div class="flex items-center gap-4 mb-12">
      <div class="w-1.5 h-8 bg-[#C4297D]"></div>
      <h2 class="text-3xl font-bold text-white">{{ titulo }}</h2>
    </div>

    <!-- Cambiado de contenidos a contenidosPaginados -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16">
      
      <div *ngFor="let item of contenidosPaginados" 
           (click)="goToContent(item)"
           class="group cursor-pointer">
        
        <div class="relative aspect-video rounded-2xl overflow-hidden border border-gray-800 bg-gray-900 mb-6 transition-all duration-300 group-hover:border-[#243A85] group-hover:scale-[1.02]">
          <img [src]="item.thumbnail || 'https://picsum.photos/400/225'" 
               class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        </div>

        <div class="px-1">
          <h4 class="text-[#C4297D] text-xs font-bold uppercase tracking-widest mb-2">
              {{ item.categoria || item.categoria_nombre || 'Contenido' }}
          </h4>
          
          <h3 class="text-xl font-bold text-white mb-3 leading-tight group-hover:text-[#243A85] transition-colors">
              {{ item.titulo }}
          </h3>
          
          <p class="text-gray-400 text-sm leading-relaxed line-clamp-2 mb-4">
              {{ item.descripcion || 'Breve descripción del contenido para dar contexto al usuario.' }}
          </p>

          <div class="flex items-center mb-5"> 
            <button (click)="toggleFavorito($event, item)" 
                    type="button"
                    class="relative z-50 flex items-center gap-2 py-1.5 px-4 rounded-md border text-[10px] font-bold uppercase transition-all duration-200"
                    [ngClass]="item.es_favorito 
                      ? 'bg-[#C4297D] border-[#C4297D] text-white' 
                      : 'bg-transparent border-gray-600 text-gray-400 hover:border-white hover:text-white'">
              
              <i [class]="item.es_favorito ? 'fa-solid fa-check' : 'fa-solid fa-plus'"></i>
              {{ item.es_favorito ? 'En mi lista' : 'Agregar a mi lista' }}
              
            </button>
          </div>

          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1.5">
              <span class="text-yellow-400 text-sm font-bold">⭐ {{ item.rating_promedio || '0.0' }}</span>
              <span class="text-gray-500 text-xs font-medium">({{ item.total_votos || 0 }} votos)</span>
            </div>
            <span class="text-gray-600 text-[10px] uppercase border border-gray-800 px-2 rounded">
              {{ item.tipo }}
            </span>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- Controles de Paginación -->
  <div *ngIf="totalPaginas > 1" class="mt-20 flex justify-center items-center gap-2">
    <!-- Botón Anterior -->
    <button 
      (click)="cambiarPagina(paginaActual - 1)" 
      [disabled]="paginaActual === 1"
      class="px-4 py-2 rounded-lg border text-sm font-bold uppercase tracking-wider transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
      [ngClass]="paginaActual === 1 ? 'border-gray-800 text-gray-600' : 'border-gray-700 text-gray-300 hover:bg-gray-900 hover:text-white'">
      Anterior
    </button>

    <!-- Números de Página -->
    <div class="flex gap-1.5">
      <button 
        *ngFor="let pagina of arrayPaginas" 
        (click)="cambiarPagina(pagina)"
        class="w-10 h-10 rounded-lg text-sm font-bold transition-all"
        [ngClass]="paginaActual === pagina 
          ? 'bg-[#C4297D] text-white shadow-[0_0_10px_rgba(196,41,125,0.3)]' 
          : 'bg-gray-900/50 text-gray-400 hover:bg-gray-800 hover:text-white'">
        {{ pagina }}
      </button>
    </div>

    <!-- Botón Siguiente -->
    <button 
      (click)="cambiarPagina(paginaActual + 1)" 
      [disabled]="paginaActual === totalPaginas"
      class="px-4 py-2 rounded-lg border text-sm font-bold uppercase tracking-wider transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
      [ngClass]="paginaActual === totalPaginas ? 'border-gray-800 text-gray-600' : 'border-gray-700 text-gray-300 hover:bg-gray-900 hover:text-white'">
      Siguiente
    </button>
  </div>

</div>
